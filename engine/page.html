<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#05060A;--cyan:#45E3FF;--blue:#2B6BFF;--amber:#FFC24A;--white:#F5F7FB;--muted:#8D97AB}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#05060A;overflow:hidden}
body{font-family:'Inter',sans-serif;color:var(--white);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.abs{position:absolute}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;visibility:hidden}
.lbl{position:absolute;left:0;width:1080px;text-align:center;font-weight:700;font-size:28px;letter-spacing:9px;text-transform:uppercase;color:var(--cyan)}
.lbl.amber{color:var(--amber)}
.ttl{position:absolute;left:60px;width:960px;text-align:center;font-family:'Inter Display','Inter',sans-serif;font-weight:900;letter-spacing:-2px;line-height:1.0;white-space:nowrap}
.wrap{white-space:normal;text-wrap:balance;line-height:1.02}
.grad,.grad *{background:linear-gradient(90deg,#7FF0FF 0%,#45E3FF 45%,#2B6BFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.amberT{color:var(--amber)}
.num.grad{color:transparent}
.tsub{text-wrap:balance}
.art{position:absolute;left:0;width:1080px;display:flex;justify-content:center;align-items:center}
.art svg{overflow:visible;max-height:100%}
.sub{position:absolute;left:90px;width:900px;text-align:center;font-size:30px;font-weight:600;color:var(--muted);letter-spacing:.5px;line-height:1.3}
.num{position:absolute;left:60px;width:960px;text-align:center;font-family:'Inter Display','Inter',sans-serif;font-weight:900;letter-spacing:-3px;color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums}
.card{position:absolute;left:110px;width:860px;height:172px;border-radius:30px;background:rgba(255,255,255,.055);border:1.5px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:34px;padding:0 40px;opacity:0}
.card .ic{width:104px;height:104px;border-radius:52px;border:3px solid var(--amber);display:flex;align-items:center;justify-content:center;flex:none}
.card .tt{font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:50px;line-height:1.05}
.card .st{font-size:29px;color:var(--muted);margin-top:8px;line-height:1.25}
.steprow{position:absolute;left:120px;width:840px;display:flex;align-items:center;gap:30px}
.steprow .n{width:72px;height:72px;border-radius:36px;border:3px solid #3a4356;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;color:#3a4356;flex:none;font-family:'Inter Display','Inter',sans-serif}
.steprow .tx{font-family:'Inter Display','Inter',sans-serif;font-weight:800;color:#3a4356;line-height:1.08}
.barlbl{font-size:26px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.vpill{position:absolute;width:300px;height:112px;border-radius:60px;display:flex;align-items:center;justify-content:center;font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:48px;letter-spacing:2px;opacity:0}
#blob1{width:1500px;height:1500px;left:-420px;top:-260px;background:radial-gradient(circle,rgba(43,107,255,.30) 0%,rgba(43,107,255,0) 62%)}
#blob2{width:1300px;height:1300px;left:280px;top:820px;background:radial-gradient(circle,rgba(69,227,255,.16) 0%,rgba(69,227,255,0) 62%)}
#grid{left:0;top:0;width:1080px;height:1920px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(ellipse at 50% 42%,#000 25%,transparent 72%)}
#vig{left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(0,0,0,.7) 100%)}
#grain{left:0;top:0;width:1080px;height:1920px;opacity:.04;image-rendering:pixelated}
#topbar{left:70px;width:940px;top:226px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:27px;letter-spacing:7px}
.pill{font-weight:700;font-size:21px;letter-spacing:4px;padding:10px 18px;border:1.5px solid rgba(255,255,255,.35);border-radius:40px;color:rgba(255,255,255,.85);display:flex;gap:10px;align-items:center}
#cap{left:80px;width:840px;top:1240px;height:230px;display:flex;align-items:center;justify-content:center;text-align:center}
#capt{font-family:'Inter Display','Inter',sans-serif;font-weight:800;font-size:80px;line-height:1.08;letter-spacing:-.5px;text-shadow:0 6px 28px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.9)}
#capt .hl{color:var(--cyan)} #capt .nm{color:var(--amber)}
/* animation utilities for art SVGs: times are seconds from the scene's first word */
.a-bob{animation:aBob 2.8s ease-in-out infinite}
@keyframes aBob{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
.a-float{animation:aFloat 4.2s ease-in-out infinite}
@keyframes aFloat{0%,100%{transform:translateY(-12px)}50%{transform:translateY(12px)}}
.a-spin{animation:aSpin .1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes aSpin{0%{transform:scaleX(1)}50%{transform:scaleX(-.85)}100%{transform:scaleX(1)}}
.a-rot{animation:aRot 8s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes aRot{to{transform:rotate(360deg)}}
.a-pulse{animation:aPulse 1.6s ease-in-out infinite}
@keyframes aPulse{0%,100%{opacity:.35}50%{opacity:1}}
.a-dash{stroke-dasharray:8 14;animation:aDash 1.2s linear infinite}
@keyframes aDash{to{stroke-dashoffset:-44}}
.a-up{animation:aUp 1.5s linear infinite}
@keyframes aUp{0%{transform:translateY(0);opacity:0}20%,80%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
.a-down{animation:aDown 1.5s linear infinite}
@keyframes aDown{0%{transform:translateY(0);opacity:0}20%,80%{opacity:1}100%{transform:translateY(130px);opacity:0}}
.a-draw{stroke-dasharray:3000;stroke-dashoffset:3000;animation:aDraw 2.2s ease-out forwards}
@keyframes aDraw{to{stroke-dashoffset:0}}
.a-pop{animation:aPop .55s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes aPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.a-fade{animation:aFade .6s ease-out both}
@keyframes aFade{from{opacity:0}to{opacity:1}}
.a-blink{animation:aBlink 3.2s steps(1) infinite}
@keyframes aBlink{0%,92%{opacity:1}93%,97%{opacity:.1}}
</style></head>
<body><div id="stage">
<div id="bg"><div id="blob1" class="abs"></div><div id="blob2" class="abs"></div><div id="grid" class="abs"></div></div>
<div id="scenes"></div>
<div id="topbar" class="abs">
  <div class="brand"><svg width="42" height="42" viewBox="0 0 44 44"><polygon points="22,3 40,13 40,31 22,41 4,31 4,13" fill="none" stroke="#45E3FF" stroke-width="3"/><circle cx="22" cy="22" r="6" fill="#45E3FF"/></svg>__BRAND__</div>
  <div class="pill"><svg width="26" height="20" viewBox="0 0 26 20"><path d="M2 10 V10 M7 5 V15 M12 2 V18 M17 6 V14 M22 8 V12" stroke="#45E3FF" stroke-width="3" stroke-linecap="round"/></svg>AI VOICE</div>
</div>
<div id="cap" class="abs"><div id="capt"></div></div>
<canvas id="grain" class="abs" width="360" height="640"></canvas>
<div id="vig" class="abs"></div>
</div>
<script>
const TL = __TIMELINE__;
const SC = __SCENES__;
const META = __META__;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = p => 1 - Math.pow(1 - p, 3);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eb = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const prog = (t, a, d) => clamp((t - a) / d);
const S = TL.segs;
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const mk = s => esc(s).replace(/\*([^*]+)\*/g, '<span class="grad">$1</span>');
const cue = (i, k) => { const c = S[i].chunks; return c[clamp(k ?? 0, 0, c.length - 1)].start - S[i].start; };
const dur = i => S[i].end - S[i].start;
function rise(el, lt, a, d = .5, dy = 46) { if (!el) return 0; const p = eo(prog(lt, a, d)); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; return p; }
function pop(el, lt, a, d = .45) { if (!el) return 0; const p = prog(lt, a, d); el.style.opacity = clamp(p * 2.5); el.style.transform = `scale(${lerp(.82, 1, eb(p))})`; return p; }
function fmt(v, dec, pre, suf) { const s = Number(v).toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); return (pre || '') + s + (suf || ''); }

// ---------- icon set (cards) ----------
const IC = {
  clock: '<circle cx="28" cy="31" r="20"/><path d="M28 31 V19 M22 6 H34"/>',
  card: '<rect x="6" y="13" width="44" height="31" rx="6"/><path d="M6 23 H50"/>',
  pin: '<path d="M28 50 C28 50 10 32 10 21 A18 18 0 0 1 46 21 C46 32 28 50 28 50 Z"/><circle cx="28" cy="21" r="5"/>',
  chip: '<rect x="15" y="15" width="26" height="26" rx="4"/><path d="M21 15 V8 M28 15 V8 M35 15 V8 M21 41 V48 M28 41 V48 M35 41 V48 M15 21 H8 M15 28 H8 M15 35 H8 M41 21 H48 M41 28 H48 M41 35 H48"/>',
  battery: '<rect x="6" y="17" width="40" height="22" rx="5"/><path d="M50 24 V32 M12 28 H22"/>',
  shield: '<path d="M28 6 L46 13 V27 C46 39 38 46 28 50 C18 46 10 39 10 27 V13 Z"/><path d="M20 28 L26 34 L37 22"/>',
  money: '<rect x="6" y="14" width="44" height="28" rx="5"/><circle cx="28" cy="28" r="7"/>',
  globe: '<circle cx="28" cy="28" r="21"/><ellipse cx="28" cy="28" rx="9" ry="21"/><path d="M7 28 H49"/>',
  warning: '<path d="M28 7 L50 46 H6 Z"/><path d="M28 22 V32 M28 39 V40"/>',
  check: '<circle cx="28" cy="28" r="21"/><path d="M18 29 L25 36 L39 21"/>',
  rocket: '<path d="M28 6 C38 14 40 28 36 40 H20 C16 28 18 14 28 6 Z"/><circle cx="28" cy="22" r="4"/><path d="M20 40 L14 48 M36 40 L42 48 M28 42 V50"/>',
  phone: '<rect x="16" y="5" width="24" height="46" rx="6"/><path d="M25 44 H31"/>',

  eye: '<path d="M5 28 C13 15 43 15 51 28 C43 41 13 41 5 28 Z"/><circle cx="28" cy="28" r="7"/>',
  lock: '<rect x="11" y="25" width="34" height="24" rx="5"/><path d="M18 25 V18 A10 10 0 0 1 38 18 V25"/>',
  bolt: '<path d="M31 5 L13 31 H27 L24 51 L43 23 H29 Z"/>',
  calendar: '<rect x="8" y="11" width="40" height="38" rx="6"/><path d="M8 22 H48 M19 6 V15 M37 6 V15"/>',
  chart: '<path d="M8 48 H48 M14 40 V30 M24 40 V20 M34 40 V26 M44 40 V12"/>',
  users: '<circle cx="21" cy="20" r="8"/><circle cx="38" cy="22" r="6"/><path d="M6 46 C8 34 34 34 36 46 M36 34 C44 33 50 38 50 45"/>',
  robot: '<rect x="11" y="16" width="34" height="28" rx="7"/><circle cx="21" cy="29" r="3"/><circle cx="35" cy="29" r="3"/><path d="M28 16 V8 M22 38 H34"/>',
  wifi: '<path d="M6 21 C18 10 38 10 50 21 M13 29 C21 22 35 22 43 29 M20 37 C24 33 32 33 36 37"/><circle cx="28" cy="44" r="2"/>',
  camera: '<rect x="5" y="15" width="34" height="26" rx="6"/><path d="M39 23 L51 16 V40 L39 33 Z"/>',
  car: '<path d="M7 36 V29 L14 18 H40 L48 29 V36 Z M7 29 H48"/><circle cx="17" cy="38" r="5"/><circle cx="39" cy="38" r="5"/>',
  gamepad: '<path d="M10 20 H46 A6 6 0 0 1 52 26 L50 40 A6 6 0 0 1 40 42 L36 37 H20 L16 42 A6 6 0 0 1 6 40 L4 26 A6 6 0 0 1 10 20 Z"/><path d="M15 29 H23 M19 25 V33"/>',
  download: '<path d="M28 8 V36 M17 26 L28 37 L39 26 M9 46 H47"/>',
  spark: '<path d="M28 6 L32 24 L50 28 L32 32 L28 50 L24 32 L6 28 L24 24 Z"/>'
};
const icon = (n, c = '#FFC24A') => `<svg width="58" height="58" viewBox="0 0 56 56" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">${IC[n] || IC.spark}</svg>`;

// ---------- illustration assets ----------
const GLOW = 'filter:drop-shadow(0 0 28px rgba(69,227,255,.35))';
const A = {
  drone: w => `<svg width="${w}" viewBox="-140 -80 280 175" style="overflow:visible">
   <defs><radialGradient id="aDL"><stop offset="0" stop-color="#b9f6ff"/><stop offset=".4" stop-color="#45E3FF"/><stop offset="1" stop-color="#06303f"/></radialGradient>
   <linearGradient id="aDB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3748"/><stop offset="1" stop-color="#121722"/></linearGradient></defs>
   <ellipse cx="0" cy="80" rx="80" ry="9" fill="rgba(69,227,255,.12)"/>
   <g class="a-bob">
    <path d="M-30 -8 L-86 -26 M30 -8 L86 -26" stroke="#3B465C" stroke-width="7" stroke-linecap="round"/>
    <rect x="-94" y="-36" width="16" height="13" rx="3" fill="#2E3748"/><rect x="78" y="-36" width="16" height="13" rx="3" fill="#2E3748"/>
    <ellipse cx="-86" cy="-40" rx="48" ry="7.5" fill="rgba(190,225,255,.14)"/><ellipse cx="86" cy="-40" rx="48" ry="7.5" fill="rgba(190,225,255,.14)"/>
    <g transform="translate(-86,-40)"><line class="a-spin" x1="-48" y1="0" x2="48" y2="0" stroke="rgba(235,248,255,.75)" stroke-width="3.2" stroke-linecap="round"/></g>
    <g transform="translate(86,-40)"><line class="a-spin" style="animation-delay:-.04s" x1="-48" y1="0" x2="48" y2="0" stroke="rgba(235,248,255,.75)" stroke-width="3.2" stroke-linecap="round"/></g>
    <rect x="-42" y="-23" width="84" height="42" rx="17" fill="url(#aDB)" stroke="#4A5670" stroke-width="2"/>
    <circle cx="0" cy="-1" r="12" fill="url(#aDL)"/><circle cx="-3.5" cy="-4.5" r="3.2" fill="#fff" opacity=".85"/>
    <circle cx="-29" cy="6" r="3.2" fill="#FFC24A"/><circle cx="29" cy="6" r="3.2" fill="#FFC24A"/>
    <path d="M-26 19 L-33 32 M26 19 L33 32 M-44 32 L-22 32 M22 32 L44 32" stroke="#3B465C" stroke-width="4.5" stroke-linecap="round"/>
   </g></svg>`,
  phone: w => `<svg width="${w}" viewBox="0 0 300 420" style="${GLOW}"><defs><linearGradient id="aPh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17346a"/><stop offset="1" stop-color="#0a1222"/></linearGradient></defs>
   <ellipse cx="150" cy="400" rx="95" ry="10" fill="rgba(69,227,255,.12)"/>
   <g class="a-float"><rect x="70" y="20" width="160" height="340" rx="30" fill="#0E131C" stroke="#4A5670" stroke-width="4"/>
   <rect x="82" y="38" width="136" height="304" rx="20" fill="url(#aPh)"/><rect x="128" y="27" width="44" height="8" rx="4" fill="#2E3748"/>
   <rect x="98" y="66" width="104" height="14" rx="7" fill="rgba(255,255,255,.8)"/><rect x="98" y="90" width="70" height="10" rx="5" fill="rgba(255,255,255,.35)"/>
   <rect x="98" y="122" width="104" height="96" rx="14" fill="rgba(69,227,255,.28)" class="a-pulse"/>
   <rect x="98" y="232" width="48" height="48" rx="13" fill="rgba(255,194,74,.55)"/><rect x="154" y="232" width="48" height="48" rx="13" fill="rgba(255,255,255,.18)"/>
   <rect x="98" y="290" width="48" height="36" rx="12" fill="rgba(255,255,255,.12)"/><rect x="154" y="290" width="48" height="36" rx="12" fill="rgba(69,227,255,.35)"/></g></svg>`,
  chip: w => `<svg width="${w}" viewBox="0 0 400 400" style="${GLOW}"><defs><linearGradient id="aCh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#45E3FF"/><stop offset="1" stop-color="#2B6BFF"/></linearGradient></defs>
   <g stroke="#45E3FF" stroke-width="4" fill="none" opacity=".75"><path class="a-dash" d="M200 110 V20 M150 110 V50 H60 M250 110 V60 H350 M200 290 V380 M150 290 V350 H40 M250 290 V340 H360 M110 200 H20 M290 200 H380"/></g>
   <g stroke="#4A5670" stroke-width="6" stroke-linecap="round">${[130, 160, 190, 220, 250].map(v => `<path d="M${v + 10} 100 V85 M${v + 10} 300 V315 M100 ${v + 10} H85 M300 ${v + 10} H315"/>`).join('')}</g>
   <rect x="100" y="100" width="200" height="200" rx="24" fill="#121722" stroke="#4A5670" stroke-width="4"/>
   <rect x="145" y="145" width="110" height="110" rx="14" fill="url(#aCh)" class="a-pulse"/>
   <rect x="160" y="160" width="80" height="80" rx="8" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3"/></svg>`,
  cloud: w => `<svg width="${w}" viewBox="0 0 420 420"><g style="${GLOW}"><g fill="#45E3FF" opacity=".2"><circle cx="140" cy="140" r="72"/><circle cx="222" cy="108" r="92"/><circle cx="300" cy="150" r="64"/><rect x="72" y="140" width="296" height="74" rx="37"/></g></g>
   <g>${[0, 1, 2, 3].map(k => `<circle class="a-up" style="animation-delay:-${k * .37}s" cx="190" cy="370" r="8" fill="#45E3FF"/><circle class="a-down" style="animation-delay:-${k * .37 + .18}s" cx="250" cy="240" r="8" fill="#FFC24A"/>`).join('')}</g></svg>`,
  laptop: w => `<svg width="${w}" viewBox="0 0 460 330" style="${GLOW}"><g class="a-float"><rect x="80" y="20" width="300" height="200" rx="16" fill="#0E131C" stroke="#4A5670" stroke-width="4"/>
   <rect x="96" y="36" width="268" height="168" rx="8" fill="#0f2547"/>${[0, 1, 2, 3, 4].map(k => `<rect x="${118 + k * 48}" y="${150 - k * 18}" width="30" height="${36 + k * 18}" rx="5" fill="${k === 4 ? '#FFC24A' : 'rgba(69,227,255,.6)'}" class="a-pulse" style="animation-delay:-${k * .3}s"/>`).join('')}
   <path d="M40 232 H420 L396 262 H64 Z" fill="#1a2130" stroke="#4A5670" stroke-width="4" stroke-linejoin="round"/></g><ellipse cx="230" cy="310" rx="170" ry="10" fill="rgba(69,227,255,.1)"/></svg>`,
  car: w => `<svg width="${w}" viewBox="0 0 520 260" style="${GLOW}"><path d="M40 170 V140 C40 128 50 118 62 116 L130 106 L190 62 C200 55 212 52 224 52 H330 C346 52 360 58 372 70 L410 108 L462 120 C474 123 482 133 482 145 V170 Z" fill="#121722" stroke="#4A5670" stroke-width="4" stroke-linejoin="round"/>
   <path d="M200 106 L230 72 H320 L352 106 Z" fill="rgba(69,227,255,.22)"/><path d="M60 140 H110" stroke="#FFC24A" stroke-width="6" stroke-linecap="round"/><path d="M440 138 H470" stroke="#45E3FF" stroke-width="6" stroke-linecap="round"/>
   ${[140, 390].map(x => `<g transform="translate(${x},176)"><circle r="40" fill="#0b0e14" stroke="#4A5670" stroke-width="5"/><g class="a-rot" style="animation-duration:1.2s"><path d="M0 -26 V26 M-26 0 H26" stroke="#45E3FF" stroke-width="5" stroke-linecap="round"/></g></g>`).join('')}
   <path d="M20 222 H500" stroke="rgba(255,255,255,.2)" stroke-width="3" class="a-dash"/></svg>`,
  robot: w => `<svg width="${w}" viewBox="0 0 360 420" style="${GLOW}"><g class="a-float"><path d="M180 40 V80" stroke="#4A5670" stroke-width="6"/><circle cx="180" cy="34" r="12" fill="#FFC24A" class="a-pulse"/>
   <rect x="80" y="80" width="200" height="150" rx="40" fill="#121722" stroke="#4A5670" stroke-width="4"/><rect x="104" y="112" width="152" height="74" rx="30" fill="#0f2547"/>
   <g class="a-blink"><circle cx="146" cy="149" r="15" fill="#45E3FF"/><circle cx="214" cy="149" r="15" fill="#45E3FF"/></g>
   <rect x="110" y="246" width="140" height="120" rx="30" fill="#121722" stroke="#4A5670" stroke-width="4"/><circle cx="180" cy="300" r="20" fill="none" stroke="#45E3FF" stroke-width="5" class="a-pulse"/>
   <path d="M110 270 L60 320 M250 270 L300 320" stroke="#4A5670" stroke-width="12" stroke-linecap="round"/></g></svg>`,
  globe: w => `<svg width="${w}" viewBox="0 0 400 400" style="${GLOW}"><circle cx="200" cy="200" r="150" fill="rgba(43,107,255,.12)" stroke="#45E3FF" stroke-width="4"/>
   <g fill="none" stroke="rgba(69,227,255,.55)" stroke-width="3"><ellipse cx="200" cy="200" rx="150" ry="55"/><path d="M50 200 H350 M200 50 V350"/></g>
   <ellipse class="a-rot" style="animation-duration:5s" cx="200" cy="200" rx="70" ry="150" fill="none" stroke="#45E3FF" stroke-width="3"/>
